name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wrapper image
        run: docker build -t hermes-agent-wrapper:test .

      - name: Verify Hermes binary starts
        run: docker run --rm hermes-agent-wrapper:test version
